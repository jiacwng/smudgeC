name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write   # required to upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: initialize codeql
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f  # codeql-bundle-v2.26.2
        with:
          languages: c-cpp

      # CodeQL needs to watch a real build to analyse C
      - name: build
        run: make

      - name: analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f  # codeql-bundle-v2.26.2
        with:
          category: "/language:c-cpp"
